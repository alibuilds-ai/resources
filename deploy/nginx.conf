# Serves the resources site under /resources/ on alibuilds.blog.
# Runs in nginxinc/nginx-unprivileged (non-root, listens on 8080).
# Document root is /usr/share/nginx/html; the site is bind-mounted read-only at
# /usr/share/nginx/html/resources, so every relative path in the HTML resolves
# unchanged and /resources -> /resources/ is nginx's own built-in redirect.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout combined;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # nginx-unprivileged cannot write to /var/cache/nginx
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Emit relative Location headers. nginx would otherwise build absolute
        # URLs from its own listen port, leaking http://alibuilds.blog:8080/...
        # through Traefik on every directory redirect.
        absolute_redirect off;

        # Static site: nothing here should ever accept a body.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        # Redirects and TLS headers are Traefik's job (it terminates TLS and
        # owns the / -> /resources/ redirect). nginx only serves bytes.

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # PathPrefix(/resources) reaches nginx without the slash too; the
        # built-in directory redirect never fires because the slashless URI
        # falls through to the catch-all 404 below.
        location = /resources { return 301 /resources/; }

        location /resources/ {
            autoindex off;
            try_files $uri $uri/ $uri/index.html =404;

            location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800";
            }
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache";
            }
        }

        # Anything outside /resources/ is not this container's business.
        location / { return 404; }
    }
}
